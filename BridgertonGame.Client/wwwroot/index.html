<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Bridgerton Game</title>
    <base href="/" />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Jeu Bridgerton - Chroniques de Lady Whistledown" />
    <meta name="theme-color" content="#7172C5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bridgerton" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=1.0.0" />
    <link rel="stylesheet" href="css/mon-espace.css?v=1.0.0" />
    <link rel="icon" type="image/png" href="images/LadyWithldown.png" />
    <link rel="apple-touch-icon" href="images/LadyWithldown.png" />
    <link href="BridgertonGame.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-lady-whistledown">
                <img src="images/LadyWithldown.png" alt="Lady Whistledown" class="loading-silhouette" />
            </div>
            <div class="loading-text">Chargement...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/push-notifications.js"></script>
    
    <!-- Scroll to element script -->
    <script>
        window.scrollToElement = function(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
                
                // Ajouter temporairement une classe pour l'animation
                element.classList.add('article-highlight');
                setTimeout(() => {
                    element.classList.remove('article-highlight');
                }, 3000);
            }
        };
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker enregistré:', registration);
                })
                .catch(error => {
                    console.log('Erreur Service Worker:', error);
                });
        }
    </script>
</body>

</html>
